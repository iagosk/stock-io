services:
  api_stock-io:
    build: ./api/
    container_name: api_stock
    ports: 
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/api
      - node_modules:/app/node_modules
    command: npm run start:dev
  db_stock-io:
    container_name: database-stock
    image: postgres:17-alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pq_isalready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  interface_prod:
    build:
      context: ./interface/
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    environment:
      - NODE_ENV=production
 
 
  interface_dev:
    container_name: interface_dev
    build:
      context: ./interface/
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
          target: /app/package.json
        - action: rebuild
          path: ./vite.config.ts
          target: /app/vite.config.ts
  web:
    build: ./interface/
    ports:
      - "3030:3030"
    volumes:
     - .:/app
     - ./node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true
    command: npm start

volumes:
  node_modules:
  postgres_data: